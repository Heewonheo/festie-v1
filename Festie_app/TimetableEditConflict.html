#festie-stage{position:fixed;left:0;top:0;width:390px}

#festie-stage main{overflow-y:auto!important}
.app-mode .sb{height:max(44px, env(safe-area-inset-top))!important;box-sizing:border-box;align-items:flex-end!important}

<script>
(function(){
  var app = navigator.standalone || (window.matchMedia && (matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches));
  if (app) document.documentElement.classList.add('app-mode');
  function fit(){
    var st=document.getElementById('festie-stage'); if(!st) return;
    var w=window.innerWidth, h=window.innerHeight, z=w/390;
    st.style.zoom=z;
    st.firstElementChild.style.height=(h/z)+'px';
  }
  document.addEventListener('DOMContentLoaded',function(){
    var root=document.body.firstElementChild;
    var st=document.createElement('div'); st.id='festie-stage';
    document.body.insertBefore(st, root); st.appendChild(root);
    var bg=getComputedStyle(root).backgroundColor; document.documentElement.style.background=bg; document.body.style.background=bg;
    fit();
  });
  window.addEventListener('resize',fit); window.addEventListener('orientationchange',function(){setTimeout(fit,200)});
})();
</script>
