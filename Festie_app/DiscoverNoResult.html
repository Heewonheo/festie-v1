<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Festie</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Festie">
<meta name="theme-color" content="#0A0A0A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta charset="utf-8">
<title>탐색 — 홈 (이미지 캐러셀)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@600;700&amp;family=Hanken+Grotesk:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
a{color:#0A0A0A}a:hover{color:#0A0A0A}
input::placeholder,textarea::placeholder{color:rgba(10,10,10,0.55);opacity:1}
input::placeholder{color:rgba(10,10,10,0.62)}
</style>
<style>
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{display:block!important}
#festie-stage{position:fixed;left:0;top:0;width:390px}
#festie-stage>div{width:390px!important}
#festie-stage main{overflow-y:auto!important}
.app-mode .sb{height:max(44px, env(safe-area-inset-top))!important;box-sizing:border-box;align-items:flex-end!important}
.app-mode .sb>*{visibility:hidden}
</style>
<script>
(function(){
  var app = navigator.standalone || (window.matchMedia && (matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches));
  if (app) document.documentElement.classList.add('app-mode');
  function fit(){
    var st=document.getElementById('festie-stage'); if(!st) return;
    var w=window.innerWidth, h=window.innerHeight, z=w/390;
    st.style.zoom=z;
    st.firstElementChild.style.height=(h/z)+'px';
  }
  document.addEventListener('DOMContentLoaded',function(){
    var root=document.body.firstElementChild;
    var st=document.createElement('div'); st.id='festie-stage';
    document.body.insertBefore(st, root); st.appendChild(root);
    var bg=getComputedStyle(root).backgroundColor; document.documentElement.style.background=bg; document.body.style.background=bg;
    fit();
  });
  window.addEventListener('resize',fit); window.addEventListener('orientationchange',function(){setTimeout(fit,200)});
})();
</script>
</head>
<body>


<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3D9FF; color: #0A0A0A; display: flex; flex-direction: column; font-family: 'Hanken Grotesk', 'Noto Sans KR', sans-serif; overflow: hidden">

  <div class="sb" style="height: 44px; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0">

      <rect x="10" y="2" width="3" height="10" rx="1" fill="#0A0A0A"></rect>
      <rect x="18.75" y="0.75" width="21.5" height="10.5" rx="3" fill="none" stroke="#0A0A0A" stroke-width="1.5"></rect>

    </div>

    <section style="padding: 0 28px 8px 0">
      <h1 style="margin: 0; font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 56px; letter-spacing: -0.02em; line-height: 0.9; padding-top: 6px">DISCOVER</h1>
      <div style="margin-top: 18px; display: flex; align-items: center; gap: 10px; height: 56px; box-sizing: border-box; border: 1.5px solid #0A0A0A; background: transparent; padding: 0 16px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
        <label for="festival-search-c" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">페스티벌 검색</label>
        <input id="festival-search-c" type="search" value="재즈 파티" placeholder="페스티벌, 도시, 장르 검색" style="flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; padding: 0; font-family: 'Noto Sans KR', sans-serif; font-size: 16px; color: #0A0A0A; outline-offset: 2px">
      </div>
    </section>

    

    
      <div style="padding: 32px 28px 32px 0; display: flex; flex-direction: column; gap: 4px; font-family: 'Noto Sans KR', sans-serif">
        <span style="font-weight: 700; font-size: 14px">검색 결과가 없어요</span>
        <span style="font-size: 13px; color: rgba(10,10,10,0.72)">다른 페스티벌 이름이나 도시, 장르로 찾아봐요</span>
      </div>
    
    <div style="height: 24px; flex-shrink: 0"></div>
  </main>

  <nav aria-label="메인 탭" style="background: #0A0A0A; padding: 8px 28px 22px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); flex-shrink: 0">
    <a href="DiscoverCarousel.html" aria-current="page" style="min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: #F3D9FF">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg>
      <span style="font-family: 'Josefin Sans', 'Noto Sans KR', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.04em; line-height: 1">탐색</span>
    </a>
    <a href="Main.html" style="min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: rgba(243,217,255,0.65)">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="1"></rect><path d="M3.5 10h17M8 3v4M16 3v4M9 15l2 2 4-4"></path></svg>
      <span style="font-family: 'Josefin Sans', 'Noto Sans KR', sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.04em; line-height: 1">준비</span>
    </a>
    <a href="RecordHome.html" style="min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: rgba(243,217,255,0.65)">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="1"></rect><circle cx="9" cy="10" r="1.75"></circle><path d="M20.5 15.5l-5-5-9.5 9"></path></svg>
      <span style="font-family: 'Josefin Sans', 'Noto Sans KR', sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.04em; line-height: 1">기록</span>

    <a href="#" style="min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: rgba(243,217,255,0.65)">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.75"></circle><path d="M4.5 20.5c1.3-3.6 4-5.5 7.5-5.5s6.2 1.9 7.5 5.5"></path></svg>
      <span style="font-family: 'Josefin Sans', 'Noto Sans KR', sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.04em; line-height: 1">MY</span>
    </a>
  </nav>
</div>

</body>
